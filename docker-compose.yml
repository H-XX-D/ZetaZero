version: '3.8'

# ============================================================================
#   Z.E.T.A. Docker Compose
# ============================================================================
#
# QUICKSTART:
#   ./quickstart.sh             # Safe mode
#   ./quickstart.sh --unlock    # Edit config freely
#
# DIRECT DOCKER:
#   docker compose up -d                          # 16GB VRAM
#   docker compose --profile lite up -d           # 8GB VRAM
#   docker compose --profile cpu up -d            # CPU-only
#
# ============================================================================

services:
  zeta:
    # image: ghcr.io/h-xx-d/zetazero:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeta
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    environment:
      - ZETA_HOST=0.0.0.0
      - ZETA_PORT=8080
      # 14B + 7B Production Models (16GB VRAM)
      - MODEL_MAIN=/models/qwen2.5-14b-instruct-q4_k_m.gguf
      - MODEL_CODER=/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      - MODEL_EMBED=/models/nomic-embed-text-v1.5.f16.gguf
      - GPU_LAYERS_MAIN=49
      - GPU_LAYERS_CODER=35
      - ZETA_DREAM_INTERVAL=300
      - ZETA_DREAM_DIR=/storage/dreams
      - ZETA_GRAPH_PATH=/storage/blocks/graph.bin
      # Auto-index codebase (uncomment to enable)
      # - INDEX_PATH=/codebase
    volumes:
      # Config: cp zeta.conf.quickstart zeta.conf (simple) or zeta.conf.all-knobs (126+ params)
      # - ./zeta.conf:/app/zeta.conf:ro
      # Models directory
      - ~/models:/models:ro
      # Persistent storage (graph, dreams, memories)
      - ~/.zetazero/storage:/storage
      # Codebase for indexing (uncomment)
      # - /path/to/your/project:/codebase:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Smaller config for 8GB VRAM GPUs
  zeta-lite:
    image: ghcr.io/h-xx-d/zetazero:latest
    container_name: zeta-lite
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    profiles:
      - lite
    environment:
      - ZETA_HOST=0.0.0.0
      - ZETA_PORT=8080
      # 7B + 3B for smaller GPUs
      - MODEL_MAIN=/models/qwen2.5-7b-instruct-q4_k_m.gguf
      - MODEL_CODER=/models/qwen2.5-coder-3b-instruct-q4_k_m.gguf
      - MODEL_EMBED=/models/nomic-embed-text-v1.5.f16.gguf
      - GPU_LAYERS_MAIN=35
      - GPU_LAYERS_CODER=28
      - ZETA_DREAM_INTERVAL=600
      - ZETA_DREAM_DIR=/storage/dreams
      - ZETA_GRAPH_PATH=/storage/blocks/graph.bin
      # Auto-index your codebase on first run (uncomment and set path)
      # - INDEX_PATH=/codebase
    volumes:
      - ~/models:/models:ro
      - ~/.zetazero/storage:/storage
      # Mount your codebase for indexing (uncomment and set path)
      # - /path/to/your/project:/codebase:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # LiteLLM Proxy - Routes to cloud APIs (OpenAI, Anthropic, etc.)
  # Use with zeta or zeta-lite when you want hybrid local/cloud
  # Start with: docker-compose --profile litellm up -d
  litellm-proxy:
    image: python:3.11-slim
    container_name: litellm-proxy
    restart: unless-stopped
    network_mode: host
    profiles:
      - litellm
    environment:
      # API Keys - set these in .env or export before running
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Model configuration
      - LITELLM_MODEL=gpt-4o-mini
      - LITELLM_14B_MODEL=claude-3-5-sonnet-20241022
      - LITELLM_7B_MODEL=gpt-4o-mini
      - LITELLM_REASONING_MODEL=claude-3-5-sonnet-20241022
      - LITELLM_CODE_MODEL=gpt-4o
    volumes:
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: >
      bash -c "pip install litellm && python scripts/litellm_proxy.py --port 8081"