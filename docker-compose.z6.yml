# Z6-specific docker-compose override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.z6.yml up -d
#
# This uses Z6's zeta.conf which points to:
#   - Models at /home/xx/models/
#   - Storage at /mnt/HoloGit/blocks (existing graph)

version: '3.8'

services:
  zeta:
    volumes:
      # Z6 zeta.conf has all paths configured
      - ./zeta.conf:/app/zeta.conf:ro
      # Override storage to use existing Z6 graph
      - /mnt/HoloGit/blocks:/storage
      # Models as configured in zeta.conf
      - /home/xx/models:/models:ro
