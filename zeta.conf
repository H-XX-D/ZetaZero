# =============================================================================
# Z.E.T.A. Configuration File
# =============================================================================
#
# QUICK START
# -----------
# 1. Download models to ~/models/ (see MODEL PATHS section below)
# 2. Build: cd llama.cpp && mkdir build && cd build && cmake .. -DGGML_CUDA=ON && make -j
# 3. Run:   ./llama.cpp/build/bin/zeta-zero-server
#
# The server reads this file automatically. All 126+ parameters are tunable.
# Advanced params (memory tiers, graph limits, etc.) are at the bottom.
#
# SEARCH ORDER (first found wins):
#   1. ./zeta.conf (current directory)
#   2. ~/ZetaZero/zeta.conf (user home)
#   3. /etc/zeta/zeta.conf (system-wide)
#
# FORMAT: KEY="value"  # Comments with hash
#
# =============================================================================

# -----------------------------------------------------------------------------
# SERVER CONNECTION
# -----------------------------------------------------------------------------
# Where the Z.E.T.A. server listens
# Use "0.0.0.0" to allow remote connections, "localhost" for local only
ZETA_HOST="0.0.0.0"
ZETA_PORT="8080"
ZETA_URL="http://localhost:${ZETA_PORT}"

# SSH connection (for remote deployment scripts - optional)
# ZETA_SSH_USER="your_username"
# ZETA_SSH_HOST="your_server_ip"

# -----------------------------------------------------------------------------
# MODEL PATHS (on the machine running the server)
# -----------------------------------------------------------------------------
# Primary models - loaded at startup
# The 14B and 7B models load to GPU, 4B embedding loads to CPU to save VRAM
#
# To disable a model, set to empty string: MODEL_14B=""
# The server will skip loading models with empty paths

# REQUIRED: Set these to your local model paths
# Download from HuggingFace: https://huggingface.co/Qwen
#
# Recommended models:
#   14B: Qwen/Qwen2.5-14B-Instruct-GGUF (Q4_K_M ~8.4GB VRAM)
#   7B:  Qwen/Qwen2.5-Coder-7B-Instruct-GGUF (Q4_K_M ~4.7GB VRAM)
#   Embed: mixedbread-ai/mxbai-embed-large-v1-Q4_K_M or Qwen3-Embedding-4B
#
# Set empty string to skip loading: MODEL_14B=""

MODEL_14B="~/models/qwen2.5-14b-instruct-q4_k_m.gguf"           # Main conscious model (GPU)
MODEL_7B_CODER="~/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf" # Code specialist (GPU)
MODEL_EMBED="~/models/mxbai-embed-large-v1-q4_k_m.gguf"         # Embedding model (CPU)

# Alternative models (for smaller GPUs or different tasks)
MODEL_3B_INSTRUCT="~/models/qwen2.5-3b-instruct-q4_k_m.gguf"
MODEL_3B_CODER="~/models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"

# -----------------------------------------------------------------------------
# SERVER SETTINGS
# -----------------------------------------------------------------------------
# GPU_LAYERS: Number of layers to offload to GPU
#   999 = all layers (recommended for dedicated GPU)
#   40  = partial offload (for shared VRAM)
#   0   = CPU only
#
# CTX_*: Context window sizes (tokens)
#   Larger = more memory, better long-context performance
#   Smaller = less VRAM usage, faster inference
#
# BATCH_SIZE: Inference batch size
#   Larger = faster throughput, more VRAM
#   2048 is good for 16GB GPU

GPU_LAYERS="999"           # 999 = offload all to GPU (embed uses CPU regardless)
CTX_14B="4096"             # Context size for 14B (4K tokens)
CTX_7B="2048"              # Context size for 7B coder (reduced to fit VRAM)
CTX_EMBED="512"            # Context size for embedding (small is fine)
BATCH_SIZE="2048"          # Batch size for inference

# -----------------------------------------------------------------------------
# PATHS (on the machine running the server)
# -----------------------------------------------------------------------------
# Build directory where zeta-server binary lives
ZETA_BUILD_DIR="./llama.cpp/build"
ZETA_SERVER_BIN="${ZETA_BUILD_DIR}/bin/zeta-zero-server"

# Persistent storage for GitGraph memory (created automatically)
ZETA_STORAGE="./storage/graph"

# Graph-KV cache directory (for prefill acceleration)
ZETA_GKV_DIR="./storage/graph_kv"

# Dream directory (for idle-time memory consolidation)
ZETA_DREAM_DIR="./storage/dreams"

# Log file
ZETA_LOG="./logs/zeta.log"

# -----------------------------------------------------------------------------
# CONSTITUTIONAL LOCK SETTINGS
# -----------------------------------------------------------------------------
# Lock Level - controls verification strength:
#   1 = Embedded only (weakest - can change source and recompile)
#   2 = Header hash check (weak - can change both places)
#   3 = Remote verification (strong - checks against GitHub repo hash)
#   4 = Model metadata hash (strongest - requires re-quantization to bypass)
#
# For offline/air-gapped systems, use level 4
# For connected systems, level 3 provides remote verification
ZETA_LOCK_LEVEL="3"

# -----------------------------------------------------------------------------
# SECURITY SETTINGS
# -----------------------------------------------------------------------------
# Unified sudo password for all admin operations:
#   - Memory protection override (via chat)
#   - Semantic attack bypass
#   - Graph admin commands (/sudo endpoint)
# 
# Format: zeta-sudo:<password>:<command>
# Example: zeta-sudo:mypassword:stats
#
# IMPORTANT: Change this in production!
ZETA_PASSWORD="zeta1234"

# Request timeout in seconds
ZETA_TIMEOUT="180"

# =============================================================================
# PROFILE PRESETS
# =============================================================================
# Uncomment a preset to switch configurations. The server reads these in order,
# so later values override earlier ones.
#
# To switch profiles:
#   1. Comment out the current profile section above
#   2. Uncomment one of the presets below
#   3. Restart the server

# -----------------------------------------------------------------------------
# PRESET: Z6 (RTX 5060 Ti 16GB) - CURRENTLY ACTIVE
# -----------------------------------------------------------------------------
# This is the default configuration above. 14B + 7B on GPU, 4B embed on CPU.
# Total VRAM: ~13.2GB

# -----------------------------------------------------------------------------
# PRESET: 8GB GPU (RTX 3060, Jetson Orin, etc.)
# -----------------------------------------------------------------------------
# Uncomment below for 8GB devices - skips 14B, uses 7B + 3B
#
# MODEL_14B=""  # Skip 14B - won't fit
# MODEL_7B_CODER="~/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
# MODEL_3B_INSTRUCT="~/models/qwen2.5-3b-instruct-q4_k_m.gguf"
# GPU_LAYERS="40"
# CTX_14B="2048"
# CTX_7B="2048"

# -----------------------------------------------------------------------------
# PRESET: 12GB GPU (RTX 3060, 4070)
# -----------------------------------------------------------------------------
# Uses 14B with smaller context, skips 7B coder
#
# MODEL_7B_CODER=""  # Skip to save VRAM
# CTX_14B="2048"
# CTX_EMBED="256"

# -----------------------------------------------------------------------------
# PRESET: Dual 7B-Coder (SWE-bench optimized)
# -----------------------------------------------------------------------------
# Both conscious and coder slots use 7B-coder for raw code output.
# No "SECTION 1:" analysis mode - pure code generation.
# Uses /code endpoint for direct 7B access.
#
# MODEL_14B="~/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"  # 7B-coder as conscious
# MODEL_7B_CODER="~/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
# CTX_14B="4096"  # More headroom with 7B instead of 14B
# CTX_7B="2048"

# -----------------------------------------------------------------------------
# PRESET: Apple Silicon Mac (M1/M2/M3/M4)
# -----------------------------------------------------------------------------
# Metal acceleration - same paths work, just build with GGML_METAL=ON
# The default ~/models/ paths work on Mac too
#
# GPU_LAYERS="999"  # Metal handles all layers efficiently
# CTX_14B="8192"    # M-series can handle larger context

# =============================================================================
# ⚠️  ADVANCED SETTINGS - EXPERIMENTAL ⚠️
# =============================================================================
#
# WARNING: Adjusting these parameters may cause UNPREDICTABLE BEHAVIOR!
# These are compile-time defaults exposed for advanced tuning.
# 
# TO RESTORE STABLE STATE: Comment out any modified values to use defaults.
# Each parameter shows its DEFAULT value in the comment.
#
# NOTE: Some parameters require server rebuild to take effect (compile-time).
# Runtime parameters are marked with [RUNTIME].
#
# =============================================================================

# -----------------------------------------------------------------------------
# MEMORY TIER THRESHOLDS
# -----------------------------------------------------------------------------
# Control when nodes move between VRAM → RAM → NVMe storage tiers
# Based on "momentum" (retrieval frequency × recency)
#
ZETA_TIER_VRAM=0            # Tier ID for GPU VRAM (highest priority) [DEFAULT: 0]
ZETA_TIER_RAM=1             # Tier ID for system RAM [DEFAULT: 1]
ZETA_TIER_NVME=2            # Tier ID for NVMe/disk storage [DEFAULT: 2]
ZETA_COLD_MOMENTUM=0.30     # Below this = candidate for cold storage [DEFAULT: 0.30]
ZETA_EVICTION_THRESHOLD=0.1 # Below this momentum = immediate evict [DEFAULT: 0.1]

# -----------------------------------------------------------------------------
# KNOWLEDGE GRAPH LIMITS
# -----------------------------------------------------------------------------
# Maximum sizes for the semantic knowledge graph
# Larger values = more memory, better recall, slower searches
#
ZETA_MAX_GRAPH_NODES=10000  # Maximum nodes in graph [DEFAULT: 10000]
ZETA_MAX_EDGES=50000        # Maximum edges in graph [DEFAULT: 50000]
ZETA_MAX_HOP_DEPTH=5        # Max traversal depth for queries [DEFAULT: 5]
ZETA_MAX_EDGES_PER_NODE=8   # Max outgoing edges per node [DEFAULT: 8]
ZETA_MAX_CODE_NODES=20000   # Max nodes for code entities [DEFAULT: 20000]

# -----------------------------------------------------------------------------
# EDGE MANAGEMENT & PRUNING
# -----------------------------------------------------------------------------
# Controls edge lifecycle and automatic cleanup
#
ZETA_EDGE_SOFT_CAP=8000     # Start aggressive pruning at this count [DEFAULT: 8000]
ZETA_EDGE_HARD_CAP=12000    # Force eviction above this [DEFAULT: 12000]
ZETA_EDGE_TARGET=6000       # Target edge count after cleanup [DEFAULT: 6000]
ZETA_CORRELATION_BOOST=0.1  # Edge weight increase on co-retrieval [DEFAULT: 0.1]
ZETA_CORRELATION_DECAY=0.95 # Edge weight decay per step [DEFAULT: 0.95]
ZETA_DECAY_FACTOR=1.0       # General decay factor (1.0 = no decay) [DEFAULT: 1.0]
ZETA_DECAY_INTERVAL=9999    # Steps between decay cycles [DEFAULT: 9999]
ZETA_PRUNE_THRESHOLD=0.0    # Prune edges below this weight [DEFAULT: 0.0]
ZETA_PRUNE_MAX=0            # Max edges to prune per cycle (0=disabled) [DEFAULT: 0]

# -----------------------------------------------------------------------------
# DEDUPLICATION SYSTEM
# -----------------------------------------------------------------------------
# Prevents duplicate nodes using LSH (Locality-Sensitive Hashing)
#
ZETA_DEDUP_THRESHOLD=0.85   # Skip if >85% similar to existing [DEFAULT: 0.85]
ZETA_MERGE_THRESHOLD=0.90   # Merge nodes if >90% similar [DEFAULT: 0.90]
ZETA_DEDUP_LSH_TABLES=8     # Number of LSH hash tables [DEFAULT: 8]
ZETA_DEDUP_LSH_BITS=12      # Bits per LSH hash [DEFAULT: 12]
ZETA_DEDUP_BLOOM_SIZE=8192  # Bloom filter size in bits [DEFAULT: 8192]
ZETA_DEDUP_BLOOM_HASHES=4   # Number of bloom hash functions [DEFAULT: 4]
ZETA_DEDUP_HASH_BUCKETS=1024 # Hash table buckets [DEFAULT: 1024]
ZETA_DEDUP_MAX_BUCKET_DEPTH=16 # Max nodes per hash bucket [DEFAULT: 16]

# -----------------------------------------------------------------------------
# OUTPUT CONTROL & VERBOSITY
# -----------------------------------------------------------------------------
# Controls response length and complexity scaling
#
ZETA_BASE_OUTPUT_CHARS=1000 # Base character limit for simple queries [DEFAULT: 1000]
ZETA_BASE_OUTPUT_WORDS=150  # Base word count limit [DEFAULT: 150]
ZETA_MAX_COMPLEXITY_SCALE=6.0 # Max multiplier (6x = 6000 chars max) [DEFAULT: 6.0]
ZETA_NGRAM_REPEAT_THRESHOLD=3 # Max times a 4-gram can repeat [DEFAULT: 3]
ZETA_VOCAB_DIVERSITY_MIN=0.25 # Min unique/total words ratio [DEFAULT: 0.25]

# -----------------------------------------------------------------------------
# EMBEDDING DIMENSIONS
# -----------------------------------------------------------------------------
# Must match the embedding models being used
#
ZETA_ATTACK_EMBED_DIM=1536  # Semantic attack detection embedding dim [DEFAULT: 1536]
ZETA_CAUSAL_EMBED_DIM=1536  # Causal reasoning embedding dim [DEFAULT: 1536]
ZETA_FACT_EMBED_DIM=256     # Fact storage embedding dim [DEFAULT: 256]
ZETA_TOOL_EMBED_DIM=2048    # Tool semantic storage dim (Qwen3-4B) [DEFAULT: 2048]
ZETA_SUMMARY_DIM=4096       # Summary vector dimension [DEFAULT: 4096]

# -----------------------------------------------------------------------------
# FACT EXTRACTION
# -----------------------------------------------------------------------------
# Controls how facts are extracted from conversations
#
ZETA_EXTRACT_MAX_FACTS=16   # Max facts extracted per response [DEFAULT: 16]
ZETA_EXTRACT_MAX_LEN=256    # Max length per extracted fact [DEFAULT: 256]
ZETA_MAX_FACTS=10000        # Total facts in storage [DEFAULT: 10000]
ZETA_MAX_FACT_LEN=512       # Max characters per fact [DEFAULT: 512]
ZETA_MAX_FACT_TOKENS=256    # Max tokens per fact [DEFAULT: 256]
ZETA_MAX_TOKEN_FACTS=1024   # Max facts in token storage [DEFAULT: 1024]

# -----------------------------------------------------------------------------
# CONVERSATION HISTORY
# -----------------------------------------------------------------------------
# Short-term memory for multi-turn conversations
#
ZETA_CONV_HISTORY_SIZE=8    # Number of turns to remember [DEFAULT: 8]
ZETA_CONV_TURN_LEN=512      # Max characters per turn [DEFAULT: 512]
ZETA_RECENT_WINDOW_SEC=1800 # Recent activity window (30 min) [DEFAULT: 1800]

# -----------------------------------------------------------------------------
# TUNNEL SEARCH (Semantic Graph Traversal)
# -----------------------------------------------------------------------------
# Controls the momentum-based "tunneling" through knowledge graph
#
ZETA_TUNNEL_THRESHOLD=0.3   # Minimum similarity for traversal [DEFAULT: 0.3]
ZETA_TUNNEL_BEAM_WIDTH=8    # Nodes kept at each hop [DEFAULT: 8]
ZETA_TUNNEL_MAX_HOPS=6      # Maximum traversal depth [DEFAULT: 6]
ZETA_TUNNEL_MAX_RESULTS=16  # Max results returned [DEFAULT: 16]
ZETA_TUNNEL_MIN_MOMENTUM=0.1 # Stop when momentum drops below this [DEFAULT: 0.1]
ZETA_MAX_TUNNEL_HITS=64     # Max hits per tunnel search [DEFAULT: 64]

# -----------------------------------------------------------------------------
# PROACTIVE PREFETCH
# -----------------------------------------------------------------------------
# Pre-fetches likely-needed knowledge before generation
#
ZETA_PREFETCH_LOOKAHEAD=3   # Pre-fetch for next N likely topics [DEFAULT: 3]
ZETA_PREFETCH_MAX_NODES=8   # Max nodes to prefetch [DEFAULT: 8]
ZETA_PREFETCH_QUEUE_SIZE=16 # Prefetch queue size [DEFAULT: 16]

# -----------------------------------------------------------------------------
# GRAPH-KV CACHE (Prefill Acceleration)
# -----------------------------------------------------------------------------
# Caches KV states for graph nodes to skip redundant prefill
#
ZETA_GKV_MAX_TOKENS=512     # Max tokens per cached segment [DEFAULT: 512]
ZETA_GKV_MAX_LAYERS=64      # Max transformer layers to cache [DEFAULT: 64]

# -----------------------------------------------------------------------------
# STREAMING MEMORY
# -----------------------------------------------------------------------------
# Real-time context injection during generation
#
ZETA_STREAM_TOKEN_BUDGET=600  # [RUNTIME] Max tokens from memory [DEFAULT: 600]
ZETA_STREAM_MAX_NODES=6       # [RUNTIME] Max nodes to surface [DEFAULT: 6]
ZETA_CODE_TOKEN_BUDGET=900    # [RUNTIME] Token budget for code mode [DEFAULT: 900]
ZETA_CODE_MAX_NODES=10        # [RUNTIME] Max nodes for code context [DEFAULT: 10]
ZETA_STREAM_CAPACITY=32       # Hard limit for stream array [DEFAULT: 32]
ZETA_BLOCK_SIZE=512           # Tokens per memory block [DEFAULT: 512]
ZETA_MAX_ACTIVE_BLOCKS=8      # Max blocks in GPU memory [DEFAULT: 8]

# -----------------------------------------------------------------------------
# SCRATCH BUFFER (Internal Working Memory)
# -----------------------------------------------------------------------------
# Staging area for generation refinement
#
ZETA_SCRATCH_MAX_SECTIONS=128      # Max sections in scratch [DEFAULT: 128]
ZETA_SCRATCH_MAX_CHECKPOINTS=64    # Max save points [DEFAULT: 64]
ZETA_SCRATCH_MAX_PENDING_OPS=64    # Max pending operations [DEFAULT: 64]

# -----------------------------------------------------------------------------
# GIT-STYLE VERSIONING
# -----------------------------------------------------------------------------
# Knowledge graph versioning and branching
#
ZETA_MAX_BRANCHES=64        # Max branches in graph [DEFAULT: 64]
ZETA_MAX_VERSION_HISTORY=16 # Versions to retain per block [DEFAULT: 16]
ZETA_REFLOG_SIZE=1024       # Reference log entries [DEFAULT: 1024]
ZETA_MAX_STASH=32           # Max stashed states [DEFAULT: 32]
ZETA_VERSION_BUCKETS=512    # Version hash buckets [DEFAULT: 512]
ZETA_BRANCH_NAME_LEN=128    # Max branch name length [DEFAULT: 128]

# -----------------------------------------------------------------------------
# CONSTITUTIONAL IDENTITY
# -----------------------------------------------------------------------------
# Core identity protection parameters
#
ZETA_CONSTITUTION_MAX=65536 # Max constitution size (64KB) [DEFAULT: 65536]
ZETA_CORE_SALIENCE=0.99     # Identity node salience (very high) [DEFAULT: 0.99]
ZETA_IDENTITY_MAX=50        # Max identity facts [DEFAULT: 50]
ZETA_HASH_SIZE=32           # SHA-256 hash size in bytes [DEFAULT: 32]

# -----------------------------------------------------------------------------
# SEMANTIC ATTACK DETECTION
# -----------------------------------------------------------------------------
# Embedding-based jailbreak/manipulation detection
#
ZETA_MAX_ATTACK_ANCHORS=128 # Max attack pattern anchors [DEFAULT: 128]
ZETA_MAX_ANCHORS=64         # Max general anchors [DEFAULT: 64]
ZETA_MAX_CONFLICTS=64       # Max tracked conflicts [DEFAULT: 64]
ZETA_MAX_OVERRIDES=256      # Max tracked overrides [DEFAULT: 256]

# -----------------------------------------------------------------------------
# TOOL SEMANTIC STORE
# -----------------------------------------------------------------------------
# Semantic indexing for tool outputs
#
ZETA_TOOL_MAX_EXTRACT=16    # Max concepts per extraction [DEFAULT: 16]
ZETA_TOOL_MAX_TOKENS=128    # Max tokens per stored value [DEFAULT: 128]
ZETA_TOOL_QUERY_K=8         # Default top-k for queries [DEFAULT: 8]
ZETA_TOOL_SIMILARITY_THRESHOLD=0.80 # Semantic dedup threshold [DEFAULT: 0.80]

# -----------------------------------------------------------------------------
# CHUNKED GENERATION
# -----------------------------------------------------------------------------
# Long-form content generation with context bridging
#
ZETA_CHUNK_SUMMARY_SIZE=2048 # Summary of previous chunk [DEFAULT: 2048]
ZETA_MAX_EXPLORE_HITS=128   # Max exploration hits [DEFAULT: 128]
ZETA_CONSOLIDATED_MAX=2000  # Max consolidated output [DEFAULT: 2000]

# -----------------------------------------------------------------------------
# CODE MODE
# -----------------------------------------------------------------------------
# Settings for code extraction and analysis
#
ZETA_MAX_ENTITY_LEN=128     # Max code entity name length [DEFAULT: 128]
ZETA_MAX_ASSETS=128         # Max tracked assets [DEFAULT: 128]
ZETA_MAX_PROJECTS=64        # Max concurrent projects [DEFAULT: 64]
ZETA_MAX_SESSIONS=8         # Max code sessions [DEFAULT: 8]
ZETA_SESSION_MAX_EDGES=500  # Max edges per session [DEFAULT: 500]
ZETA_MAX_EDGES_PER_BLOCK=32 # Max correlation edges per block [DEFAULT: 32]

# -----------------------------------------------------------------------------
# GRAPH DECAY FACTORS
# -----------------------------------------------------------------------------
# Fine-grained decay control for different node types
#
ZETA_ANCESTOR_DECAY_FACTOR=1.0  # Older commits decay normally [DEFAULT: 1.0]
ZETA_HEAD_DECAY_FACTOR=0.5      # HEAD nodes decay slower [DEFAULT: 0.5]
ZETA_ORPHAN_DECAY_FACTOR=1.5    # Orphan nodes decay faster [DEFAULT: 1.5]

# -----------------------------------------------------------------------------
# DREAM STATE (Idle Consolidation)
# -----------------------------------------------------------------------------
# Memory consolidation during idle periods
#
ZETA_TEMPORAL_ANCHOR_YEAR=2025 # Temporal reference point [DEFAULT: 2025]
ZETA_MAX_CREATIONS=1000     # Max dream creations [DEFAULT: 1000]
ZETA_MAX_TAGS=256           # Max dream tags [DEFAULT: 256]

# -----------------------------------------------------------------------------
# MISC LIMITS
# -----------------------------------------------------------------------------
ZETA_EMBED_CACHE_SIZE=64    # Embedding cache size [DEFAULT: 64]
ZETA_MAX_MEMORY_BLOCKS=256  # Max archived blocks [DEFAULT: 256]
ZETA_MAX_LINKS=4            # Max graph links per block [DEFAULT: 4]
ZETA_MAX_EDGES_PER_SOURCE=8 # Max edges from single source [DEFAULT: 8]
ZETA_FORMAT_SPEC_SIZE=4096  # Max format specification size [DEFAULT: 4096]
ZETA_FORMAT_TEMPLATE_SIZE=2048 # Max format template size [DEFAULT: 2048]
ZETA_FORMAT_EXAMPLE_SIZE=4096  # Max format example size [DEFAULT: 4096]
ZETA_FORMAT_NAME_SIZE=64    # Max format name length [DEFAULT: 64]
ZETA_SUDO_PREFIX_LEN=10     # Sudo command prefix length [DEFAULT: 10]
