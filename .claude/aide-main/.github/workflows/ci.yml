name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check renderer bundle builds
        run: npm run build:renderer
      
      - name: Verify package.json
        run: |
          node -e "require('./package.json')"
          echo "✅ package.json is valid"
      
      - name: Check for common issues
        run: |
          # Check for console.logs (optional - remove if too strict)
          # echo "Checking for console.logs..."
          # if grep -r "console\.log" src/ main.js --exclude-dir=node_modules; then
          #   echo "⚠️ Found console.log statements (consider removing for production)"
          # fi
          
          # Verify required files exist
          [ -f "main.js" ] || (echo "❌ main.js missing" && exit 1)
          [ -f "package.json" ] || (echo "❌ package.json missing" && exit 1)
          [ -f "src/renderer/index.js" ] || (echo "❌ src/renderer/index.js missing" && exit 1)
          echo "✅ All required files present"

  build-test:
    name: Test Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build renderer bundle
        run: npm run build:renderer
      
      - name: Verify build output
        run: |
          [ -f "renderer.bundle.js" ] || (echo "❌ renderer.bundle.js not created" && exit 1)
          echo "✅ Build successful"

