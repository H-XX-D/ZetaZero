<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dee Dee 3D Print Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: #161b22;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #30363d;
        }
        
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .subtitle {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        
        .accessory-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .accessory-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .accessory-item input {
            accent-color: #a855f7;
        }
        
        .accessory-item .icon {
            font-size: 16px;
        }
        
        .accessory-item .name {
            flex: 1;
            font-size: 13px;
        }
        
        .size-info {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .size-info .label {
            font-size: 11px;
            color: #a855f7;
            margin-bottom: 4px;
        }
        
        .size-info .value {
            font-size: 14px;
            font-weight: 600;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e6edf3;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .viewport {
            flex: 1;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: #8b949e;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .print-tips {
            font-size: 11px;
            color: #8b949e;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
        }
        
        .print-tips strong {
            color: #e6edf3;
        }
        
        .accessory-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .accessory-item.locked:hover {
            background: rgba(255,255,255,0.03);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>🖨️ 3D Print Dee Dee</h1>
        <p class="subtitle">Generate STL for your Bambu X1</p>
        
        <div class="section">
            <div class="section-title">Size</div>
            <select id="sizeSelect" onchange="changeSize()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3;">
                <option value="small" selected>Small (35mm) - Desk</option>
                <option value="big">Big (105mm) - Display</option>
                <option value="keychain">Keychain (20mm) - No base</option>
            </select>
        </div>
        
        <div class="size-info">
            <div class="label">Print Size</div>
            <div class="value" id="sizeDisplay">35mm wide</div>
        </div>
        
        <div class="section">
            <div class="section-title">Base</div>
            <div class="accessory-item">
                <input type="checkbox" id="acc-base" checked onchange="toggleBody()">
                <span class="icon">🤖</span>
                <span class="name">Dee Dee Body</span>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Accessories</div>
            <div id="accessoryList"></div>
        </div>
        
        <button class="btn btn-primary" onclick="exportSTL()">
            ⬇️ Download Combined STL
        </button>
        
        <div class="section" style="margin-top: 16px;">
            <div class="section-title">Export Individual Parts</div>
            <select id="partSelect" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; margin-bottom: 8px;">
                <option value="body">Dee Dee Body</option>
                <!-- Dynamically populated by updatePartSelect() -->
            </select>
            <button class="btn btn-secondary" onclick="exportSinglePart()">
                ⬇️ Download Selected Part
            </button>
        </div>
        
        <button class="btn btn-secondary" onclick="exportAllParts()" style="margin-top: 8px;">
            📦 Download All Parts (ZIP)
        </button>
        
        <div class="print-tips">
            <strong>Print Tips:</strong><br>
            • Layer height: 0.16mm<br>
            • Infill: 15-20%<br>
            • Supports: Auto for accessories<br>
            • Material: PLA or PETG
        </div>
    </div>
    
    <div class="viewport">
        <canvas id="canvas"></canvas>
        <div class="controls-hint">🖱️ Drag to rotate • Scroll to zoom</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === READ URL PARAMETERS ===
        function initFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            
            if (code) {
                try {
                    const data = JSON.parse(atob(code));
                    console.log('Loaded print config:', data);
                    
                    // Apply unlocked items
                    if (data.unlocked && Array.isArray(data.unlocked)) {
                        // Will be applied after ACCESSORIES is defined
                        window.preloadedUnlocks = data.unlocked;
                    }
                    if (data.equipped && Array.isArray(data.equipped)) {
                        window.preloadedEquipped = data.equipped;
                    }
                    if (data.size) {
                        window.preloadedSize = data.size;
                }
                if (typeof data.base === 'boolean') {
                    window.preloadedBase = data.base;
                }
                if (typeof data.withAccessories === 'boolean') {
                    window.preloadedAccessories = data.withAccessories;
                    }
                } catch (e) {
                    console.log('Could not parse URL code:', e);
                }
            }
        }
        initFromUrlParams();
        
        // === THREE.JS SETUP ===
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);
        
        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(80, 60, 100);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        scene.add(directionalLight);
        
        const backLight = new THREE.DirectionalLight(0xa855f7, 0.3);
        backLight.position.set(-50, 50, -50);
        scene.add(backLight);
        
        // Grid helper
        const grid = new THREE.GridHelper(100, 10, 0x30363d, 0x21262d);
        scene.add(grid);
        
        // === MATERIALS ===
        const silverMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xc0c0c0, 
            metalness: 0.7, 
            roughness: 0.3 
        });
        const darkMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            metalness: 0.2, 
            roughness: 0.8 
        });
        const goldMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            metalness: 0.8, 
            roughness: 0.2 
        });
        const redMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, 
            metalness: 0.3, 
            roughness: 0.5 
        });
        const greenMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x228b22, 
            metalness: 0.3, 
            roughness: 0.5 
        });
        const tealMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x14b8a6, 
            metalness: 0.5, 
            roughness: 0.3,
            emissive: 0x14b8a6,
            emissiveIntensity: 0.3
        });
        
        // === DIMENSIONS (mm) ===
        // Base size: 50mm x 50mm x 34mm
        const SCALE = 1; // 1 unit = 1mm
        const BODY_WIDTH = 35; // Was 45, brought in 5mm each side
        const BODY_HEIGHT = 22;
        const BODY_DEPTH = 18;
        
        // === MODEL PARTS ===
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        
        // Size/mode settings
        let currentScale = 1;
        let isKeychain = false;
        let polyMultiplier = 1; // Polygon multiplier for quality
        let showBody = true; // Whether to include Dee Dee body
        let allowAccessories = true; // Whether accessories should auto-enable
        
        // Get segment count based on current quality setting
        function seg(base) {
            return Math.round(base * polyMultiplier);
        }
        
        function changeSize() {
            const size = document.getElementById('sizeSelect').value;
            const display = document.getElementById('sizeDisplay');
            
            if (size === 'small') {
                currentScale = 1;
                isKeychain = false;
                polyMultiplier = 1;
                display.textContent = '35mm wide';
            } else if (size === 'big') {
                currentScale = 3;
                isKeychain = false;
                polyMultiplier = 2; // Double the polygons for big print
                display.textContent = '105mm wide (3x) - High Poly';
            } else if (size === 'keychain') {
                currentScale = 0.57; // ~20mm
                isKeychain = true;
                polyMultiplier = 0.75; // Slightly fewer for small keychain
                display.textContent = '20mm wide + loop';
            }
            
            rebuildModel();
        }
        
        // Toggle body visibility
        function toggleBody() {
            showBody = document.getElementById('acc-base').checked;
            rebuildModel();
        }
        
        // Accessory definitions - all locked by default
        const ACCESSORIES = {
            // Starter
            antenna: { name: 'Antenna', icon: '📡', enabled: false, unlocked: false, category: 'starter' },
            flower: { name: 'Flower', icon: '🌸', enabled: false, unlocked: false, category: 'starter' },
            bowtie: { name: 'Bow Tie', icon: '🎀', enabled: false, unlocked: false, category: 'starter' },
            mustache: { name: 'Mustache', icon: '🥸', enabled: false, unlocked: false, category: 'starter' },
            halo: { name: 'Halo', icon: '😇', enabled: false, unlocked: false, category: 'starter' },
            horns: { name: 'Devil Horns', icon: '😈', enabled: false, unlocked: false, category: 'starter' },
            
            // Hats
            crown: { name: 'Crown', icon: '👑', enabled: false, unlocked: false, category: 'hats' },
            tophat: { name: 'Top Hat', icon: '🎩', enabled: false, unlocked: false, category: 'hats' },
            wizard: { name: 'Wizard Hat', icon: '🧙', enabled: false, unlocked: false, category: 'hats' },
            cowboy: { name: 'Cowboy Hat', icon: '🤠', enabled: false, unlocked: false, category: 'hats' },
            propeller: { name: 'Propeller Hat', icon: '🎡', enabled: false, unlocked: false, category: 'hats' },
            santa: { name: 'Santa Hat', icon: '🎅', enabled: false, unlocked: false, category: 'hats' },
            viking: { name: 'Viking Helmet', icon: '🪓', enabled: false, unlocked: false, category: 'hats' },
            ninja: { name: 'Ninja Mask', icon: '🥷', enabled: false, unlocked: false, category: 'hats' },
            pirate: { name: 'Pirate Hat', icon: '🏴‍☠️', enabled: false, unlocked: false, category: 'hats' },
            
            // Face
            headphones: { name: 'Headphones', icon: '🎧', enabled: false, unlocked: false, category: 'face' },
            sunglasses: { name: 'Sunglasses', icon: '🕶️', enabled: false, unlocked: false, category: 'face' },
            monocle: { name: 'Monocle', icon: '🧐', enabled: false, unlocked: false, category: 'face' },
            
            // Body
            chain: { name: 'Gold Chain', icon: '⛓️', enabled: false, unlocked: false, category: 'body' },
            cape: { name: 'Cape', icon: '🦸', enabled: false, unlocked: false, category: 'body' },
            wings: { name: 'Wings', icon: '🦋', enabled: false, unlocked: false, category: 'body' },
        };
        
        if (typeof window.preloadedAccessories === 'boolean') {
            allowAccessories = window.preloadedAccessories;
        }
        const baseCheckbox = document.getElementById('acc-base');
        if (typeof window.preloadedBase === 'boolean') {
            showBody = window.preloadedBase;
        }
        if (baseCheckbox) {
            baseCheckbox.checked = showBody;
        }
        
        // Apply preloaded data from URL params
        if (window.preloadedUnlocks && window.preloadedUnlocks.length > 0) {
            // Set unlocked status based on data
            window.preloadedUnlocks.forEach(id => {
                if (ACCESSORIES[id]) {
                    ACCESSORIES[id].unlocked = true;
                }
            });
        }
        if (window.preloadedEquipped && allowAccessories) {
            // Enable only equipped items (if unlocked)
            Object.keys(ACCESSORIES).forEach(key => {
                if (ACCESSORIES[key].unlocked && window.preloadedEquipped.includes(key)) {
                    ACCESSORIES[key].enabled = true;
                }
            });
        }
        if (window.preloadedSize) {
            // Will apply after DOM is ready
            setTimeout(() => {
                const sizeSelect = document.getElementById('sizeSelect');
                if (sizeSelect) {
                    sizeSelect.value = window.preloadedSize;
                    changeSize();
                }
            }, 100);
        }
        
        // Update part select dropdown to only show unlocked items
        function updatePartSelect() {
            const select = document.getElementById('partSelect');
            if (!select) return;
            
            // Clear existing options except body
            select.innerHTML = '<option value="body">Dee Dee Body</option>';
            
            // Group unlocked accessories by category
            const categories = {
                'starter': { label: 'Starter', items: [] },
                'hats': { label: 'Hats', items: [] },
                'face': { label: 'Face', items: [] },
                'body': { label: 'Body', items: [] }
            };
            
            Object.entries(ACCESSORIES).forEach(([id, acc]) => {
                if (acc.unlocked && categories[acc.category]) {
                    categories[acc.category].items.push({ id, ...acc });
                }
            });
            
            // Add optgroups with unlocked items
            Object.entries(categories).forEach(([catId, cat]) => {
                if (cat.items.length > 0) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = cat.label;
                    cat.items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = `${item.name} ${item.icon}`;
                        optgroup.appendChild(option);
                    });
                    select.appendChild(optgroup);
                }
            });
        }
        
        // Call after DOM ready
        setTimeout(updatePartSelect, 150);
        
        // Code validation (browser-compatible HMAC)
        const SECRET = 'D33D33-SW4G-2024';
        
        async function hmacSha256(key, message) {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(key);
            const msgData = encoder.encode(message);
            
            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
            const hashArray = Array.from(new Uint8Array(signature));
            const base64 = btoa(String.fromCharCode(...hashArray));
            // Convert to base64url
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '').substring(0, 12);
        }
        
        async function applyCode() {
            const codeInput = document.getElementById('unlockCode');
            const status = document.getElementById('codeStatus');
            const code = codeInput.value.trim();
            
            if (!code) {
                status.style.color = '#f87171';
                status.textContent = 'Please enter a code';
                return;
            }
            
            try {
                const parts = code.split('-');
                if (parts.length !== 3 || parts[0] !== 'DEEDEE') {
                    throw new Error('Invalid format');
                }
                
                const payloadB64 = parts[1];
                const signature = parts[2];
                
                // Decode base64url
                const payloadStr = atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/'));
                
                // Verify signature
                const expectedSig = await hmacSha256(SECRET, payloadStr);
                
                if (signature !== expectedSig) {
                    throw new Error('Invalid signature');
                }
                
                const payload = JSON.parse(payloadStr);
                
                // Check expiration (30 days)
                const age = Date.now() - payload.t;
                const maxAge = 30 * 24 * 60 * 60 * 1000;
                if (age > maxAge) {
                    throw new Error('Code expired');
                }
                
                // Unlock accessories!
                const unlocked = payload.u || [];
                let count = 0;
                
                for (const id of unlocked) {
                    if (ACCESSORIES[id]) {
                        ACCESSORIES[id].unlocked = true;
                        count++;
                    }
                }
                
                // Rebuild UI
                rebuildAccessoryList();
                
                status.style.color = '#22c55e';
                status.textContent = '✓ Unlocked ' + count + ' accessories!';
                
            } catch (e) {
                status.style.color = '#f87171';
                status.textContent = '✗ ' + (e.message || 'Invalid code');
            }
        }
        
        function rebuildAccessoryList() {
            const list = document.getElementById('accessoryList');
            list.innerHTML = '';
            
            // Count unlocked items
            const unlockedCount = Object.values(ACCESSORIES).filter(a => a.unlocked).length;
            const totalCount = Object.keys(ACCESSORIES).length;
            
            // Show unlock count header
            const header = document.createElement('div');
            header.style.cssText = 'font-size: 11px; color: #8b949e; margin-bottom: 10px; text-align: center;';
            header.textContent = `${unlockedCount}/${totalCount} unlocked`;
            list.appendChild(header);
            
            // Only show unlocked accessories
            for (const [id, acc] of Object.entries(ACCESSORIES)) {
                if (!acc.unlocked) continue; // Skip locked items
                
                const div = document.createElement('div');
                div.className = 'accessory-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'acc-' + id;
                checkbox.checked = acc.enabled;
                checkbox.onchange = () => toggleAccessory(id);
                
                const icon = document.createElement('span');
                icon.className = 'icon';
                icon.textContent = acc.icon;
                
                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = acc.name;
                
                div.appendChild(checkbox);
                div.appendChild(icon);
                div.appendChild(name);
                
                div.onclick = (e) => {
                    if (e.target.type !== 'checkbox') {
                        checkbox.click();
                    }
                };
                
                list.appendChild(div);
            }
            
            // Show message if nothing unlocked
            if (unlockedCount === 0) {
                const msg = document.createElement('div');
                msg.style.cssText = 'text-align: center; color: #8b949e; padding: 20px; font-size: 13px;';
                msg.innerHTML = '🔒 No drip unlocked yet!<br><br>Use AIDE to unlock accessories.';
                list.appendChild(msg);
            }
        }
        
        // Build accessory list UI (initial)
        rebuildAccessoryList();
        
        function toggleAccessory(id) {
            ACCESSORIES[id].enabled = document.getElementById('acc-' + id).checked;
            rebuildModel();
        }
        
        // === BUILD DEE DEE ===
        function createDeeDeeBody(skipBase = false) {
            const group = new THREE.Group();
            
            // Main body - horizontal capsule (pill shape)
            // Cylinder for middle + 2 spheres for ends
            const bodyRadius = BODY_HEIGHT / 2;
            const cylinderLength = BODY_WIDTH - BODY_HEIGHT; // Subtract the sphere caps
            
            // Middle cylinder (high poly for smooth curves)
            const cylinderGeo = new THREE.CylinderGeometry(bodyRadius, bodyRadius, cylinderLength, seg(48));
            const cylinder = new THREE.Mesh(cylinderGeo, silverMaterial);
            cylinder.rotation.z = Math.PI / 2; // Rotate to horizontal
            group.add(cylinder);
            
            // Left cap
            const sphereGeo = new THREE.SphereGeometry(bodyRadius, seg(48), seg(24));
            const leftCap = new THREE.Mesh(sphereGeo, silverMaterial);
            leftCap.position.x = -cylinderLength / 2;
            group.add(leftCap);
            
            // Right cap
            const rightCap = new THREE.Mesh(sphereGeo, silverMaterial);
            rightCap.position.x = cylinderLength / 2;
            group.add(rightCap);
            
            // Eyes (adjusted for narrower body)
            const eyeGeo = new THREE.SphereGeometry(3, seg(24), seg(24));
            const leftEye = new THREE.Mesh(eyeGeo, darkMaterial);
            leftEye.position.set(-8, 2, bodyRadius - 2);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, darkMaterial);
            rightEye.position.set(8, 2, bodyRadius - 2);
            group.add(rightEye);
            
            // Mouth (slid back 1mm total)
            const smileCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-3.4, 4.4, bodyRadius - 0.9),
                new THREE.Vector3(0, 0.2, bodyRadius),
                new THREE.Vector3(3.4, 4.4, bodyRadius - 0.9)
            );
            const smileGeo = new THREE.TubeGeometry(smileCurve, seg(24), 0.85, seg(12), false);
            const smile = new THREE.Mesh(smileGeo, darkMaterial);
            group.add(smile);
            
            // Base/stand for stability when printing (skip for keychain)
            if (!skipBase) {
                const baseGeo = new THREE.CylinderGeometry(15, 18, 4, seg(48));
                const base = new THREE.Mesh(baseGeo, silverMaterial);
                base.position.y = -bodyRadius - 2;
                group.add(base);
            }
            
            return group;
        }
        
        function createAntenna() {
            const group = new THREE.Group();
            
            // Stem (5mm tall)
            const stemGeo = new THREE.CylinderGeometry(1.5, 1.5, 5, seg(24));
            const stem = new THREE.Mesh(stemGeo, silverMaterial);
            stem.position.y = 2.5;
            group.add(stem);
            
            // Ball (12% smaller)
            const ballGeo = new THREE.SphereGeometry(3.5, seg(24), seg(24));
            const ball = new THREE.Mesh(ballGeo, tealMaterial);
            ball.position.y = 6.5;
            group.add(ball);
            
            group.position.y = BODY_HEIGHT / 2 - 1.5; // Down 1.5mm
            group.position.z = -3; // Move back 3mm total
            group.rotation.x = -0.16; // Tilt back ~9 degrees
            return group;
        }
        
        function createCrown() {
            const group = new THREE.Group();
            
            // Crown base ring
            const ringGeo = new THREE.TorusGeometry(8, 2, seg(16), seg(32));
            const ring = new THREE.Mesh(ringGeo, goldMaterial);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
            
            // Crown points
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const pointGeo = new THREE.ConeGeometry(2, 8, seg(8));
                const point = new THREE.Mesh(pointGeo, goldMaterial);
                point.position.set(
                    Math.cos(angle) * 7,
                    5,
                    Math.sin(angle) * 7

        function createKeychainLoop() {
            const group = new THREE.Group();
            
            // Loop: 7mm wide, 5mm tall, 2mm thick, 2.5mm hole
            const outerWidth = 7;
            const outerHeight = 5;
            const thickness = 2;
            const holeRadius = 1.25; // 2.5mm diameter
            
            // Create torus-like shape (rounded rectangle with hole)
            const loopShape = new THREE.Shape();
            const r = 1.5; // corner radius
            loopShape.moveTo(-outerWidth/2 + r, -outerHeight/2);
            loopShape.lineTo(outerWidth/2 - r, -outerHeight/2);
            loopShape.quadraticCurveTo(outerWidth/2, -outerHeight/2, outerWidth/2, -outerHeight/2 + r);
            loopShape.lineTo(outerWidth/2, outerHeight/2 - r);
            loopShape.quadraticCurveTo(outerWidth/2, outerHeight/2, outerWidth/2 - r, outerHeight/2);
            loopShape.lineTo(-outerWidth/2 + r, outerHeight/2);
            loopShape.quadraticCurveTo(-outerWidth/2, outerHeight/2, -outerWidth/2, outerHeight/2 - r);
            loopShape.lineTo(-outerWidth/2, -outerHeight/2 + r);
            loopShape.quadraticCurveTo(-outerWidth/2, -outerHeight/2, -outerWidth/2 + r, -outerHeight/2);
            
            // Cut hole
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, holeRadius, 0, Math.PI * 2, false);
            loopShape.holes.push(holePath);
            
            const extrudeSettings = { depth: thickness, bevelEnabled: false };
            const loopGeo = new THREE.ExtrudeGeometry(loopShape, extrudeSettings);
            const loop = new THREE.Mesh(loopGeo, silverMaterial);
            loop.rotation.x = Math.PI; // Rotated 90 degrees
            loop.position.set(0, -BODY_HEIGHT / 2 - 4.5, 0); // Bottom, down 1.5mm
            group.add(loop);
            
            return group;
        }
        
        function rebuildModel() {
            // Clear existing model
            while (modelGroup.children.length > 0) {
                modelGroup.remove(modelGroup.children[0]);
            }
            
            // Add body if enabled (pass keychain mode to skip base)
            if (showBody) {
                modelGroup.add(createDeeDeeBody(isKeychain));
            }
            
            // Keychain mode: add loop, no accessories
            if (isKeychain && showBody) {
                modelGroup.add(createKeychainLoop());
            } else if (!isKeychain) {
                // Add enabled accessories - Starter
                if (ACCESSORIES.antenna.enabled) modelGroup.add(createAntenna());
                if (ACCESSORIES.flower.enabled) modelGroup.add(createFlower());
                if (ACCESSORIES.bowtie.enabled) modelGroup.add(createBowTie());
                if (ACCESSORIES.mustache.enabled) modelGroup.add(createMustache());
                if (ACCESSORIES.halo.enabled) modelGroup.add(createHalo());
                if (ACCESSORIES.horns.enabled) modelGroup.add(createHorns());
                
                // Hats (only one at a time makes sense, but allow multiple for fun)
                if (ACCESSORIES.crown.enabled) modelGroup.add(createCrown());
                if (ACCESSORIES.tophat.enabled) modelGroup.add(createTopHat());
                if (ACCESSORIES.wizard.enabled) modelGroup.add(createWizardHat());
                if (ACCESSORIES.cowboy.enabled) modelGroup.add(createCowboyHat());
                if (ACCESSORIES.propeller.enabled) modelGroup.add(createPropeller());
                if (ACCESSORIES.santa.enabled) modelGroup.add(createSantaHat());
                if (ACCESSORIES.viking.enabled) modelGroup.add(createVikingHelmet());
                if (ACCESSORIES.ninja.enabled) modelGroup.add(createNinjaMask());
                if (ACCESSORIES.pirate.enabled) modelGroup.add(createPirateHat());
                
                // Face
                if (ACCESSORIES.headphones.enabled) modelGroup.add(createHeadphones());
                if (ACCESSORIES.sunglasses.enabled) modelGroup.add(createSunglasses());
                if (ACCESSORIES.monocle.enabled) modelGroup.add(createMonocle());
                
                // Body
                if (ACCESSORIES.chain.enabled) modelGroup.add(createChain());
                if (ACCESSORIES.cape.enabled) modelGroup.add(createCape());
                if (ACCESSORIES.wings.enabled) modelGroup.add(createWings());
            }
            
            // Apply scale
            modelGroup.scale.set(currentScale, currentScale, currentScale);
        }
        
        // Initial build
        rebuildModel();
        
        // === ORBIT CONTROLS (manual) ===
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0.3, y: 0.5 };
        let zoom = 100;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            rotation.y += deltaX * 0.01;
            rotation.x += deltaY * 0.01;
            rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('wheel', (e) => {
            zoom += e.deltaY * 0.1;
            zoom = Math.max(50, Math.min(200, zoom));
        });
        
        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            
            camera.position.x = Math.sin(rotation.y) * Math.cos(rotation.x) * zoom;
            camera.position.y = Math.sin(rotation.x) * zoom;
            camera.position.z = Math.cos(rotation.y) * Math.cos(rotation.x) * zoom;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        animate();
        
        // Resize handler
        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        
        // === STL EXPORT ===
        // STLExporter implementation
        function exportSTL() {
            const stl = generateSTL(modelGroup);
            const sizeName = isKeychain ? 'keychain' : (currentScale === 3 ? 'big' : 'small');
            downloadFile(stl, `deedee-${sizeName}-combined.stl`, 'application/octet-stream');
        }
        
        // Map of accessory ID to create function
        const accessoryCreators = {
            'antenna': createAntenna,
            'flower': createFlower,
            'bowtie': createBowTie,
            'mustache': createMustache,
            'halo': createHalo,
            'horns': createHorns,
            'crown': createCrown,
            'tophat': createTopHat,
            'wizard': createWizardHat,
            'cowboy': createCowboyHat,
            'propeller': createPropeller,
            'santa': createSantaHat,
            'viking': createVikingHelmet,
            'ninja': createNinjaMask,
            'pirate': createPirateHat,
            'headphones': createHeadphones,
            'sunglasses': createSunglasses,
            'monocle': createMonocle,
            'chain': createChain,
            'cape': createCape,
            'wings': createWings
        };
        
        function exportSinglePart() {
            const partId = document.getElementById('partSelect').value;
            const sizeName = currentScale === 3 ? 'big' : (currentScale < 1 ? 'small' : 'standard');
            
            // Create a temporary group for the single part
            const tempGroup = new THREE.Group();
            
            if (partId === 'body') {
                tempGroup.add(createDeeDeeBody(false)); // Always with base for standalone
            } else if (accessoryCreators[partId]) {
                const part = accessoryCreators[partId]();
                // Reset position for standalone printing
                part.position.set(0, 0, 0);
                part.rotation.set(0, 0, 0);
                tempGroup.add(part);
            } else {
                alert('Unknown part: ' + partId);
                return;
            }
            
            // Apply scale
            tempGroup.scale.set(currentScale, currentScale, currentScale);
            
            // Generate and download
            const stl = generateSTL(tempGroup);
            downloadFile(stl, `deedee-${partId}-${sizeName}.stl`, 'application/octet-stream');
        }
        
        function exportAllParts() {
            // Only export unlocked parts
            const unlockedParts = ['body', ...Object.keys(ACCESSORIES).filter(id => ACCESSORIES[id].unlocked)];
            const sizeName = currentScale === 3 ? 'big' : (currentScale < 1 ? 'small' : 'standard');
            
            if (unlockedParts.length <= 1) {
                alert('No accessories unlocked to export!');
                return;
            }
            
            alert(`Downloading ${unlockedParts.length} parts one by one...`);
            
            unlockedParts.forEach((partId, index) => {
                setTimeout(() => {
                    document.getElementById('partSelect').value = partId;
                    exportSinglePart();
                }, index * 500); // Stagger downloads to avoid browser blocking
            });
        }
        
        function generateSTL(group) {
            let output = 'solid DeeDee\n';
            
            group.traverse((child) => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    const matrixWorld = child.matrixWorld;
                    
                    const positions = geometry.attributes.position;
                    const indices = geometry.index;
                    
                    if (indices) {
                        for (let i = 0; i < indices.count; i += 3) {
                            const a = indices.getX(i);
                            const b = indices.getX(i + 1);
                            const c = indices.getX(i + 2);
                            
                            const vA = new THREE.Vector3().fromBufferAttribute(positions, a).applyMatrix4(matrixWorld);
                            const vB = new THREE.Vector3().fromBufferAttribute(positions, b).applyMatrix4(matrixWorld);
                            const vC = new THREE.Vector3().fromBufferAttribute(positions, c).applyMatrix4(matrixWorld);
                            
                            const normal = new THREE.Vector3()
                                .crossVectors(
                                    new THREE.Vector3().subVectors(vB, vA),
                                    new THREE.Vector3().subVectors(vC, vA)
                                ).normalize();
                            
                            output += `facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                            output += '  outer loop\n';
                            output += `    vertex ${vA.x} ${vA.y} ${vA.z}\n`;
                            output += `    vertex ${vB.x} ${vB.y} ${vB.z}\n`;
                            output += `    vertex ${vC.x} ${vC.y} ${vC.z}\n`;
                            output += '  endloop\n';
                            output += 'endfacet\n';
                        }
                    } else {
                        for (let i = 0; i < positions.count; i += 3) {
                            const vA = new THREE.Vector3().fromBufferAttribute(positions, i).applyMatrix4(matrixWorld);
                            const vB = new THREE.Vector3().fromBufferAttribute(positions, i + 1).applyMatrix4(matrixWorld);
                            const vC = new THREE.Vector3().fromBufferAttribute(positions, i + 2).applyMatrix4(matrixWorld);
                            
                            const normal = new THREE.Vector3()
                                .crossVectors(
                                    new THREE.Vector3().subVectors(vB, vA),
                                    new THREE.Vector3().subVectors(vC, vA)
                                ).normalize();
                            
                            output += `facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                            output += '  outer loop\n';
                            output += `    vertex ${vA.x} ${vA.y} ${vA.z}\n`;
                            output += `    vertex ${vB.x} ${vB.y} ${vB.z}\n`;
                            output += `    vertex ${vC.x} ${vC.y} ${vC.z}\n`;
                            output += '  endloop\n';
                            output += 'endfacet\n';
                        }
                    }
                }
            });
            
            output += 'endsolid DeeDee\n';
            return output;
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
