<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Monaco Editor Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #1e1e1e; color: #fff; font-family: monospace; }
        #container { width: 100%; height: 600px; border: 1px solid #444; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #0a5; }
        .error { background: #a05; }
        .info { background: #05a; }
    </style>
</head>
<body>
    <h1>Monaco Editor Test</h1>
    <div id="status" class="status info">Loading Monaco...</div>
    <div id="container"></div>
    <div id="log" style="margin-top: 20px; font-size: 12px; max-height: 200px; overflow-y: auto;"></div>

    <script>
        const log = (msg, type = 'info') => {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.style.color = type === 'error' ? '#f55' : type === 'success' ? '#5f5' : '#fff';
            document.getElementById('log').appendChild(div);
            console.log(msg);
        };

        const status = (msg, type) => {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status ${type}`;
        };

        // Save Node globals
        const _module = window.module;
        const _exports = window.exports;
        const _require = window.require;
        const nodeRequire = window.nodeRequire || require;

        // Remove Node globals
        delete window.module;
        delete window.exports;
        delete window.require;

        // Set Monaco environment
        window.MonacoEnvironment = {
            baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/',
            getWorkerUrl: function(workerId, label) {
                return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/' };
                    importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
                `)}`;
            }
        };

        log('MonacoEnvironment configured');

        // Load Monaco loader
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';
        
        script.onload = function() {
            log('Monaco loader script loaded', 'success');
            
            if (typeof require === 'undefined' || typeof require.config !== 'function') {
                log('ERROR: AMD loader not available', 'error');
                status('❌ AMD Loader Failed', 'error');
                return;
            }

            // Configure AMD
            require.config({
                baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/',
                paths: {
                    'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'
                },
                nodeRequire: undefined,
                nodeRequireJs: undefined
            });

            log('AMD loader configured');

            // Load editor
            require(['vs/editor/editor.main'], function() {
                log('editor.main loaded', 'success');
                
                // Restore Node globals
                window.module = _module;
                window.exports = _exports;
                if (nodeRequire) window.nodeRequire = nodeRequire;

                if (typeof monaco !== 'undefined') {
                    log('Monaco global found!', 'success');
                    status('✅ Monaco Loaded Successfully!', 'success');
                    
                    // Create editor
                    try {
                        const editor = monaco.editor.create(document.getElementById('container'), {
                            value: '// Monaco Editor Test\nconsole.log("Hello, AIDE!");',
                            language: 'javascript',
                            theme: 'vs-dark',
                            automaticLayout: true
                        });
                        log('Editor created successfully!', 'success');
                        status('✅ Editor Working!', 'success');
                    } catch (e) {
                        log('ERROR creating editor: ' + e.message, 'error');
                        status('❌ Editor Creation Failed', 'error');
                    }
                } else {
                    log('ERROR: Monaco global not found', 'error');
                    status('❌ Monaco Global Missing', 'error');
                }
            }, function(err) {
                log('ERROR loading editor.main: ' + JSON.stringify(err), 'error');
                status('❌ Load Failed', 'error');
            });
        };

        script.onerror = function(e) {
            log('ERROR loading loader script', 'error');
            status('❌ Script Load Failed', 'error');
        };

        document.head.appendChild(script);
    </script>
</body>
</html>
