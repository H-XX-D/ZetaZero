<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dee Dee 3D Print Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html.embed, body.embed {
            height: 100%;
        }
        
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: #161b22;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #30363d;
        }
        
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .subtitle {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 20px;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        
        .accessory-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .accessory-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .accessory-item input {
            accent-color: #a855f7;
        }
        
        .accessory-item .icon {
            font-size: 16px;
        }
        
        .accessory-item .name {
            flex: 1;
            font-size: 13px;
        }
        
        .size-info {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .size-info .label {
            font-size: 11px;
            color: #a855f7;
            margin-bottom: 4px;
        }
        
        .size-info .value {
            font-size: 14px;
            font-weight: 600;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e6edf3;
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .viewport {
            flex: 1;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: #8b949e;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        .print-tips {
            font-size: 11px;
            color: #8b949e;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
        }
        
        .print-tips strong {
            color: #e6edf3;
        }
        
        .accessory-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .accessory-item.locked:hover {
            background: rgba(255,255,255,0.03);
        }
        
        /* Embedded view adjustments (used inside wardrobe preview) */
        body.embed {
            background: transparent;
            height: 100%;
        }
        
        body.embed .sidebar {
            display: none;
        }
        
        body.embed {
            display: block;
        }
        
        body.embed .viewport {
            width: 100%;
            height: 100%;
            min-height: 260px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }
        
        body.embed #canvas {
            border-radius: 14px;
        }
        
        body.embed .controls-hint {
            display: none;
        }
    </style>
</head>
<body>
    <script>
        const searchParams = new URLSearchParams(window.location.search);
        const isEmbedView = searchParams.get('embed') === '1';
        if (isEmbedView) {
            document.documentElement.classList.add('embed');
            document.body.classList.add('embed');
        }
    </script>
    <div class="sidebar">
        <h1>🖨️ 3D Print Dee Dee</h1>
        <p class="subtitle">Generate STL for your Bambu X1</p>
        
        <div class="section">
            <div class="section-title">Size</div>
            <select id="sizeSelect" onchange="changeSize()" aria-label="Select print size" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3;">
                <option value="small" selected>Small (35mm) - Desk</option>
                <option value="big">Big (105mm) - Display</option>
                <option value="keychain">Keychain (20mm) - No base</option>
            </select>
        </div>
        
        <div class="size-info">
            <div class="label">Print Size</div>
            <div class="value" id="sizeDisplay">35mm wide</div>
        </div>
        
        <div class="section">
            <div class="section-title">Base</div>
            <div class="accessory-item">
                <input type="checkbox" id="acc-base" checked disabled aria-label="Dee Dee Body (always included)">
                <label for="acc-base" style="display: flex; align-items: center; gap: 10px; flex: 1; cursor: default;">
                    <span class="icon">🤖</span>
                    <span class="name">Dee Dee Body</span>
                </label>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Accessories</div>
            <div id="accessoryList"></div>
        </div>
        
        <button class="btn btn-primary" onclick="exportSTL()">
            ⬇️ Download STL
        </button>
        
        <button class="btn btn-secondary" onclick="exportAllParts()">
            📦 Download All Parts (ZIP)
        </button>
        
        <div class="print-tips">
            <strong>Print Tips:</strong><br>
            • Layer height: 0.16mm<br>
            • Infill: 15-20%<br>
            • Supports: Auto for accessories<br>
            • Material: PLA or PETG
        </div>
    </div>
    
    <div class="viewport">
        <canvas id="canvas"></canvas>
        <div class="controls-hint">🖱️ Drag to rotate • Scroll to zoom</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === THREE.JS SETUP ===
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);
        
        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(80, 60, 100);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        scene.add(directionalLight);
        
        const backLight = new THREE.DirectionalLight(0xa855f7, 0.3);
        backLight.position.set(-50, 50, -50);
        scene.add(backLight);
        
        // Grid helper
        const grid = new THREE.GridHelper(100, 10, 0x30363d, 0x21262d);
        scene.add(grid);
        
        // === MATERIALS ===
        const silverMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xc0c0c0, 
            metalness: 0.7, 
            roughness: 0.3 
        });
        const darkMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            metalness: 0.2, 
            roughness: 0.8 
        });
        const goldMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            metalness: 0.8, 
            roughness: 0.2 
        });
        const redMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff0000, 
            metalness: 0.3, 
            roughness: 0.5 
        });
        const greenMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x228b22, 
            metalness: 0.3, 
            roughness: 0.5 
        });
        const tealMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x14b8a6, 
            metalness: 0.5, 
            roughness: 0.3,
            emissive: 0x14b8a6,
            emissiveIntensity: 0.3
        });
        
        // === DIMENSIONS (mm) ===
        // Base size: 50mm x 50mm x 34mm
        const SCALE = 1; // 1 unit = 1mm
        const BODY_WIDTH = 35; // Was 45, brought in 5mm each side
        const BODY_HEIGHT = 22;
        const BODY_DEPTH = 18;
        
        // === MODEL PARTS ===
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        
        // Size/mode settings
        let currentScale = 1;
        let isKeychain = false;
        
        function changeSize() {
            const size = document.getElementById('sizeSelect').value;
            const display = document.getElementById('sizeDisplay');
            
            if (size === 'small') {
                currentScale = 1;
                isKeychain = false;
                display.textContent = '35mm wide';
            } else if (size === 'big') {
                currentScale = 3;
                isKeychain = false;
                display.textContent = '105mm wide (3x)';
            } else if (size === 'keychain') {
                currentScale = 0.57; // ~20mm
                isKeychain = true;
                display.textContent = '20mm wide + loop';
            }
            
            rebuildModel();
        }
        
        // Accessory definitions - all unlocked for now
        const ACCESSORIES = {
            antenna: { name: 'Antenna', icon: '📡', enabled: true, unlocked: true },
            crown: { name: 'Crown', icon: '👑', enabled: false, unlocked: true },
            headphones: { name: 'Headphones', icon: '🎧', enabled: false, unlocked: true },
            sunglasses: { name: 'Sunglasses', icon: '🕶️', enabled: false, unlocked: true },
            propeller: { name: 'Propeller Hat', icon: '🎡', enabled: false, unlocked: true },
            chain: { name: 'Gold Chain', icon: '⛓️', enabled: false, unlocked: true },
            santa: { name: 'Santa Hat', icon: '🎅', enabled: false, unlocked: true },
            flower: { name: 'Flower', icon: '🌸', enabled: false, unlocked: true },
        };
        
        // Code validation (browser-compatible HMAC)
        const SECRET = 'D33D33-SW4G-2024';
        
        async function hmacSha256(key, message) {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(key);
            const msgData = encoder.encode(message);
            
            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            );
            
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
            const hashArray = Array.from(new Uint8Array(signature));
            const base64 = btoa(String.fromCharCode(...hashArray));
            // Convert to base64url
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '').substring(0, 12);
        }
        
        async function applyCode() {
            const codeInput = document.getElementById('unlockCode');
            const status = document.getElementById('codeStatus');
            const code = codeInput.value.trim();
            
            if (!code) {
                status.style.color = '#f87171';
                status.textContent = 'Please enter a code';
                return;
            }
            
            try {
                const parts = code.split('-');
                if (parts.length !== 3 || parts[0] !== 'DEEDEE') {
                    throw new Error('Invalid format');
                }
                
                const payloadB64 = parts[1];
                const signature = parts[2];
                
                // Decode base64url
                const payloadStr = atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/'));
                
                // Verify signature
                const expectedSig = await hmacSha256(SECRET, payloadStr);
                
                if (signature !== expectedSig) {
                    throw new Error('Invalid signature');
                }
                
                const payload = JSON.parse(payloadStr);
                
                // Check expiration (30 days)
                const age = Date.now() - payload.t;
                const maxAge = 30 * 24 * 60 * 60 * 1000;
                if (age > maxAge) {
                    throw new Error('Code expired');
                }
                
                // Unlock accessories!
                const unlocked = payload.u || [];
                let count = 0;
                
                for (const id of unlocked) {
                    if (ACCESSORIES[id]) {
                        ACCESSORIES[id].unlocked = true;
                        count++;
                    }
                }
                
                // Rebuild UI
                rebuildAccessoryList();
                
                status.style.color = '#22c55e';
                status.textContent = '✓ Unlocked ' + count + ' accessories!';
                
            } catch (e) {
                status.style.color = '#f87171';
                status.textContent = '✗ ' + (e.message || 'Invalid code');
            }
        }
        
        function rebuildAccessoryList() {
            const list = document.getElementById('accessoryList');
            list.innerHTML = '';
            
            for (const [id, acc] of Object.entries(ACCESSORIES)) {
                const div = document.createElement('div');
                div.className = 'accessory-item' + (acc.unlocked ? '' : ' locked');
                
                if (acc.unlocked) {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = 'acc-' + id;
                    checkbox.checked = acc.enabled;
                    checkbox.onchange = () => toggleAccessory(id);
                    
                    const icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = acc.icon;
                    
                    const name = document.createElement('span');
                    name.className = 'name';
                    name.textContent = acc.name;
                    
                    div.appendChild(checkbox);
                    div.appendChild(icon);
                    div.appendChild(name);
                    
                    div.onclick = (e) => {
                        if (e.target.type !== 'checkbox') {
                            checkbox.click();
                        }
                    };
                } else {
                    div.innerHTML = '<input type="checkbox" disabled><span class="icon">🔒</span><span class="name">Locked</span>';
                }
                
                list.appendChild(div);
            }
        }
        
        // Build accessory list UI (initial)
        rebuildAccessoryList();
        
        function toggleAccessory(id) {
            ACCESSORIES[id].enabled = document.getElementById('acc-' + id).checked;
            rebuildModel();
        }
        
        // === BUILD DEE DEE ===
        function createDeeDeeBody(skipBase = false) {
            const group = new THREE.Group();
            
            // Main body - horizontal capsule (pill shape)
            // Cylinder for middle + 2 spheres for ends
            const bodyRadius = BODY_HEIGHT / 2;
            const cylinderLength = BODY_WIDTH - BODY_HEIGHT; // Subtract the sphere caps
            
            // Middle cylinder
            const cylinderGeo = new THREE.CylinderGeometry(bodyRadius, bodyRadius, cylinderLength, 32);
            const cylinder = new THREE.Mesh(cylinderGeo, silverMaterial);
            cylinder.rotation.z = Math.PI / 2; // Rotate to horizontal
            group.add(cylinder);
            
            // Left cap
            const sphereGeo = new THREE.SphereGeometry(bodyRadius, 32, 16);
            const leftCap = new THREE.Mesh(sphereGeo, silverMaterial);
            leftCap.position.x = -cylinderLength / 2;
            group.add(leftCap);
            
            // Right cap
            const rightCap = new THREE.Mesh(sphereGeo, silverMaterial);
            rightCap.position.x = cylinderLength / 2;
            group.add(rightCap);
            
            // Eyes (adjusted for narrower body)
            const eyeGeo = new THREE.SphereGeometry(3, 16, 16);
            const leftEye = new THREE.Mesh(eyeGeo, darkMaterial);
            leftEye.position.set(-8, 2, bodyRadius - 2);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, darkMaterial);
            rightEye.position.set(8, 2, bodyRadius - 2);
            group.add(rightEye);
            
            // Mouth (slid back 1mm total)
            const smileCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-3.4, 4.4, bodyRadius - 0.9),
                new THREE.Vector3(0, 0.2, bodyRadius),
                new THREE.Vector3(3.4, 4.4, bodyRadius - 0.9)
            );
            const smileGeo = new THREE.TubeGeometry(smileCurve, 16, 0.85, 8, false);
            const smile = new THREE.Mesh(smileGeo, darkMaterial);
            group.add(smile);
            
            // Base/stand for stability when printing (skip for keychain)
            if (!skipBase) {
                const baseGeo = new THREE.CylinderGeometry(15, 18, 4, 32);
                const base = new THREE.Mesh(baseGeo, silverMaterial);
                base.position.y = -bodyRadius - 2;
                group.add(base);
            }
            
            return group;
        }
        
        function createAntenna() {
            const group = new THREE.Group();
            
            // Stem (5mm tall)
            const stemGeo = new THREE.CylinderGeometry(1.5, 1.5, 5, 16);
            const stem = new THREE.Mesh(stemGeo, silverMaterial);
            stem.position.y = 2.5;
            group.add(stem);
            
            // Ball (12% smaller)
            const ballGeo = new THREE.SphereGeometry(3.5, 16, 16);
            const ball = new THREE.Mesh(ballGeo, tealMaterial);
            ball.position.y = 6.5;
            group.add(ball);
            
            group.position.y = BODY_HEIGHT / 2 - 1.5; // Down 1.5mm
            group.position.z = -3; // Move back 3mm total
            group.rotation.x = -0.16; // Tilt back ~9 degrees
            return group;
        }
        
        function createCrown() {
            const group = new THREE.Group();
            
            // Crown base ring
            const ringGeo = new THREE.TorusGeometry(8, 2, 8, 16);
            const ring = new THREE.Mesh(ringGeo, goldMaterial);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
            
            // Crown points
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const pointGeo = new THREE.ConeGeometry(2, 8, 4);
                const point = new THREE.Mesh(pointGeo, goldMaterial);
                point.position.set(
                    Math.cos(angle) * 7,
                    5,
                    Math.sin(angle) * 7
                );
                group.add(point);
            }
            
            // Gem
            const gemGeo = new THREE.OctahedronGeometry(2);
            const gem = new THREE.Mesh(gemGeo, redMaterial);
            gem.position.set(0, 3, 8);
            group.add(gem);
            
            group.position.y = BODY_HEIGHT / 2 + 2;
            group.rotation.x = -0.1;
            return group;
        }
        
        function createHeadphones() {
            const group = new THREE.Group();
            
            // Band
            const bandGeo = new THREE.TorusGeometry(14, 1.5, 8, 32, Math.PI);
            const band = new THREE.Mesh(bandGeo, darkMaterial);
            band.rotation.x = Math.PI;
            band.position.y = 5;
            group.add(band);
            
            // Left cup
            const cupGeo = new THREE.CylinderGeometry(5, 5, 8, 16);
            const leftCup = new THREE.Mesh(cupGeo, darkMaterial);
            leftCup.position.set(-14, -2, 0);
            leftCup.rotation.z = Math.PI / 2;
            group.add(leftCup);
            
            // Right cup
            const rightCup = new THREE.Mesh(cupGeo, darkMaterial);
            rightCup.position.set(14, -2, 0);
            rightCup.rotation.z = Math.PI / 2;
            group.add(rightCup);
            
            group.position.y = BODY_HEIGHT / 2;
            return group;
        }
        
        function createSunglasses() {
            const group = new THREE.Group();
            
            // Left lens
            const lensGeo = new THREE.BoxGeometry(10, 7, 2);
            const leftLens = new THREE.Mesh(lensGeo, darkMaterial);
            leftLens.position.set(-7, 0, 0);
            group.add(leftLens);
            
            // Right lens
            const rightLens = new THREE.Mesh(lensGeo, darkMaterial);
            rightLens.position.set(7, 0, 0);
            group.add(rightLens);
            
            // Bridge
            const bridgeGeo = new THREE.BoxGeometry(4, 2, 2);
            const bridge = new THREE.Mesh(bridgeGeo, darkMaterial);
            group.add(bridge);
            
            group.position.set(0, 2, BODY_HEIGHT / 2 + 1);
            return group;
        }
        
        function createPropeller() {
            const group = new THREE.Group();
            
            // Hat base (beanie)
            const hatGeo = new THREE.SphereGeometry(10, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const hat = new THREE.Mesh(hatGeo, redMaterial);
            group.add(hat);
            
            // Stem (on top of hat)
            const stemGeo = new THREE.CylinderGeometry(1.5, 1.5, 5, 8);
            const stem = new THREE.Mesh(stemGeo, darkMaterial);
            stem.position.y = 12; // Above hat
            group.add(stem);
            
            // Propeller blades (on top of stem)
            const bladeGeo = new THREE.BoxGeometry(20, 1.5, 3);
            const blade1 = new THREE.Mesh(bladeGeo, goldMaterial);
            blade1.position.y = 16; // Above stem
            group.add(blade1);
            
            const blade2 = new THREE.Mesh(bladeGeo, goldMaterial);
            blade2.position.y = 16;
            blade2.rotation.y = Math.PI / 2;
            group.add(blade2);
            
            // Center cap
            const capGeo = new THREE.SphereGeometry(2, 8, 8);
            const cap = new THREE.Mesh(capGeo, darkMaterial);
            cap.position.y = 16;
            group.add(cap);
            
            group.position.y = BODY_HEIGHT / 2;
            return group;
        }
        
        function createChain() {
            const group = new THREE.Group();
            
            // Simple chain as connected toruses
            const linkGeo = new THREE.TorusGeometry(3, 0.8, 8, 16);
            for (let i = 0; i < 7; i++) {
                const link = new THREE.Mesh(linkGeo, goldMaterial);
                link.position.x = (i - 3) * 5;
                link.position.y = Math.sin(i * 0.5) * 2 - 5;
                link.rotation.y = i % 2 === 0 ? 0 : Math.PI / 2;
                group.add(link);
            }
            
            group.position.y = -BODY_HEIGHT / 2;
            return group;
        }
        
        function createSantaHat() {
            const group = new THREE.Group();
            
            // Hat cone
            const coneGeo = new THREE.ConeGeometry(10, 18, 16);
            const cone = new THREE.Mesh(coneGeo, redMaterial);
            cone.position.y = 6;
            cone.rotation.z = 0.3;
            group.add(cone);
            
            // White trim
            const trimGeo = new THREE.TorusGeometry(10, 2.5, 8, 16);
            const trim = new THREE.Mesh(trimGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            trim.rotation.x = Math.PI / 2;
            trim.position.y = -2;
            group.add(trim);
            
            // Pom pom
            const pomGeo = new THREE.SphereGeometry(4, 16, 16);
            const pom = new THREE.Mesh(pomGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
            pom.position.set(5, 18, 0);
            group.add(pom);
            
            group.position.y = BODY_HEIGHT / 2;
            return group;
        }
        
        function createFlower() {
            const group = new THREE.Group();
            
            // Center
            const centerGeo = new THREE.SphereGeometry(2, 16, 16);
            const center = new THREE.Mesh(centerGeo, goldMaterial);
            group.add(center);
            
            // Petals
            const petalGeo = new THREE.SphereGeometry(2.5, 8, 8);
            const petalMaterial = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const petal = new THREE.Mesh(petalGeo, petalMaterial);
                petal.position.set(Math.cos(angle) * 3.5, Math.sin(angle) * 3.5, 0);
                petal.scale.set(1, 1, 0.5);
                group.add(petal);
            }
            
            // Stem (pointing down/back into body)
            const stemGeo = new THREE.CylinderGeometry(0.5, 0.5, 8, 8);
            const stem = new THREE.Mesh(stemGeo, greenMaterial);
            stem.rotation.x = Math.PI / 4; // Angle back toward body
            stem.position.set(-3, -3, -3);
            group.add(stem);
            
            group.position.set(BODY_WIDTH / 2 - 5, BODY_HEIGHT / 2 + 3, 5);
            return group;
        }
        
        function createKeychainLoop() {
            const group = new THREE.Group();
            
            // Loop: 7mm wide, 5mm tall, 2mm thick, 2.5mm hole
            const outerWidth = 7;
            const outerHeight = 5;
            const thickness = 2;
            const holeRadius = 1.25; // 2.5mm diameter
            
            // Create torus-like shape (rounded rectangle with hole)
            const loopShape = new THREE.Shape();
            const r = 1.5; // corner radius
            loopShape.moveTo(-outerWidth/2 + r, -outerHeight/2);
            loopShape.lineTo(outerWidth/2 - r, -outerHeight/2);
            loopShape.quadraticCurveTo(outerWidth/2, -outerHeight/2, outerWidth/2, -outerHeight/2 + r);
            loopShape.lineTo(outerWidth/2, outerHeight/2 - r);
            loopShape.quadraticCurveTo(outerWidth/2, outerHeight/2, outerWidth/2 - r, outerHeight/2);
            loopShape.lineTo(-outerWidth/2 + r, outerHeight/2);
            loopShape.quadraticCurveTo(-outerWidth/2, outerHeight/2, -outerWidth/2, outerHeight/2 - r);
            loopShape.lineTo(-outerWidth/2, -outerHeight/2 + r);
            loopShape.quadraticCurveTo(-outerWidth/2, -outerHeight/2, -outerWidth/2 + r, -outerHeight/2);
            
            // Cut hole
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, holeRadius, 0, Math.PI * 2, false);
            loopShape.holes.push(holePath);
            
            const extrudeSettings = { depth: thickness, bevelEnabled: false };
            const loopGeo = new THREE.ExtrudeGeometry(loopShape, extrudeSettings);
            const loop = new THREE.Mesh(loopGeo, silverMaterial);
            loop.rotation.x = Math.PI; // Rotated 90 degrees
            loop.position.set(0, -BODY_HEIGHT / 2 - 4.5, 0); // Bottom, down 1.5mm
            group.add(loop);
            
            return group;
        }
        
        function rebuildModel() {
            // Clear existing model
            while (modelGroup.children.length > 0) {
                modelGroup.remove(modelGroup.children[0]);
            }
            
            // Always add body (pass keychain mode to skip base)
            modelGroup.add(createDeeDeeBody(isKeychain));
            
            // Keychain mode: add loop, no accessories
            if (isKeychain) {
                modelGroup.add(createKeychainLoop());
            } else {
                // Add enabled accessories
                if (ACCESSORIES.antenna.enabled) modelGroup.add(createAntenna());
                if (ACCESSORIES.crown.enabled) modelGroup.add(createCrown());
                if (ACCESSORIES.headphones.enabled) modelGroup.add(createHeadphones());
                if (ACCESSORIES.sunglasses.enabled) modelGroup.add(createSunglasses());
                if (ACCESSORIES.propeller.enabled) modelGroup.add(createPropeller());
                if (ACCESSORIES.chain.enabled) modelGroup.add(createChain());
                if (ACCESSORIES.santa.enabled) modelGroup.add(createSantaHat());
                if (ACCESSORIES.flower.enabled) modelGroup.add(createFlower());
            }
            
            // Apply scale
            modelGroup.scale.set(currentScale, currentScale, currentScale);
        }
        
        // Initial build
        rebuildModel();
        
        // === ORBIT CONTROLS (manual) ===
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0.3, y: 0.5 };
        let zoom = 100;
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            rotation.y += deltaX * 0.01;
            rotation.x += deltaY * 0.01;
            rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('wheel', (e) => {
            zoom += e.deltaY * 0.1;
            zoom = Math.max(50, Math.min(200, zoom));
        });
        
        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);
            
            camera.position.x = Math.sin(rotation.y) * Math.cos(rotation.x) * zoom;
            camera.position.y = Math.sin(rotation.x) * zoom;
            camera.position.z = Math.cos(rotation.y) * Math.cos(rotation.x) * zoom;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        animate();
        
        // Resize handler
        window.addEventListener('resize', () => {
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        
        // === STL EXPORT ===
        // STLExporter implementation
        function exportSTL() {
            const stl = generateSTL(modelGroup);
            downloadFile(stl, 'deedee.stl', 'application/octet-stream');
        }
        
        function exportAllParts() {
            alert('ZIP export coming soon! For now, use single STL export.');
        }
        
        function generateSTL(group) {
            let output = 'solid DeeDee\n';
            
            group.traverse((child) => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    const matrixWorld = child.matrixWorld;
                    
                    const positions = geometry.attributes.position;
                    const indices = geometry.index;
                    
                    if (indices) {
                        for (let i = 0; i < indices.count; i += 3) {
                            const a = indices.getX(i);
                            const b = indices.getX(i + 1);
                            const c = indices.getX(i + 2);
                            
                            const vA = new THREE.Vector3().fromBufferAttribute(positions, a).applyMatrix4(matrixWorld);
                            const vB = new THREE.Vector3().fromBufferAttribute(positions, b).applyMatrix4(matrixWorld);
                            const vC = new THREE.Vector3().fromBufferAttribute(positions, c).applyMatrix4(matrixWorld);
                            
                            const normal = new THREE.Vector3()
                                .crossVectors(
                                    new THREE.Vector3().subVectors(vB, vA),
                                    new THREE.Vector3().subVectors(vC, vA)
                                ).normalize();
                            
                            output += `facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                            output += '  outer loop\n';
                            output += `    vertex ${vA.x} ${vA.y} ${vA.z}\n`;
                            output += `    vertex ${vB.x} ${vB.y} ${vB.z}\n`;
                            output += `    vertex ${vC.x} ${vC.y} ${vC.z}\n`;
                            output += '  endloop\n';
                            output += 'endfacet\n';
                        }
                    } else {
                        for (let i = 0; i < positions.count; i += 3) {
                            const vA = new THREE.Vector3().fromBufferAttribute(positions, i).applyMatrix4(matrixWorld);
                            const vB = new THREE.Vector3().fromBufferAttribute(positions, i + 1).applyMatrix4(matrixWorld);
                            const vC = new THREE.Vector3().fromBufferAttribute(positions, i + 2).applyMatrix4(matrixWorld);
                            
                            const normal = new THREE.Vector3()
                                .crossVectors(
                                    new THREE.Vector3().subVectors(vB, vA),
                                    new THREE.Vector3().subVectors(vC, vA)
                                ).normalize();
                            
                            output += `facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                            output += '  outer loop\n';
                            output += `    vertex ${vA.x} ${vA.y} ${vA.z}\n`;
                            output += `    vertex ${vB.x} ${vB.y} ${vB.z}\n`;
                            output += `    vertex ${vC.x} ${vC.y} ${vC.z}\n`;
                            output += '  endloop\n';
                            output += 'endfacet\n';
                        }
                    }
                }
            });
            
            output += 'endsolid DeeDee\n';
            return output;
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
