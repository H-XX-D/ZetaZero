<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIDE Library</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #0a0a0f; color: #f4f4f5; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .md { background: #0f1116; border: 1px solid #222; padding: 28px; border-radius: 12px; }
    .hero { text-align: center; margin-bottom: 20px; }
    .hero h1 { font-size: 36px; background: linear-gradient(90deg,#22c55e,#a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .note { color: #a1a1aa; margin-bottom: 18px; }
    a.md-link { color: #22c55e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Library</h1>
      <p class="note">Interactive learning library — markdown content is rendered from <code>/Tutorials/</code>.</p>
      <p><a href="tutorials.html" class="md-link">← Back to AI Mastery</a></p>
    </div>

    <div id="content" class="md">Loading library…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
  <script>
    async function fetchAndRender(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        const mdParser = window.markdownit({ html: true, linkify: true, typographer: true });
        // basic styling for code blocks
        const rendered = mdParser.render(md);
        document.getElementById('content').innerHTML = rendered;
        // make links to local Tutorials open the raw file in a new tab
        document.querySelectorAll('#content a').forEach(a=>{
          const href = a.getAttribute('href');
          if (!href) return;
          if (href.startsWith('Tutorials') || href.startsWith('/Tutorials') || href.endsWith('.md')) {
            a.setAttribute('target','_blank');
            // convert relative tutorial links to absolute path under /Tutorials/
            let url = href;
            if (!href.startsWith('/')) url = '/' + href.replace(/^\/+/, '');
            a.setAttribute('href', url);
          }
        });
      } catch (err) {
        document.getElementById('content').textContent = 'Failed to load library: ' + err.message;
      }
    }

    // load the library markdown that was copied to /Tutorials/LIBRARY_INDEX.md
    fetchAndRender('/Tutorials/LIBRARY_INDEX.md');
  </script>
</body>
</html>
